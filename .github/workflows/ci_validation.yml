name: CI Validation

# Runs on every push and pull request - separate from the scheduled feature/training
# pipelines (.github/workflows/feature_pipeline.yml / training_pipeline.yml). This
# workflow does NOT touch the real feature_store/ or models/ - it's a self-contained
# smoke test (scripts/verify_setup.py) that proves the project's code, notebook, and
# Feast Entity/FeatureView/FeatureService definitions are actually valid, using a
# throwaway scratch Feast repo and synthetic data. It does not require Open-Meteo
# network access and does not commit anything back to the repository.

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run project verification (imports, syntax, notebook validity, real Feast smoke test)
        run: python scripts/verify_setup.py
